name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le code source de l'application ImmoPro n'est pas publié ;
      # seule la démonstration (demo-immopro/, données fictives) l'est.
      - name: Exclure le code source ImmoPro
        run: rm -rf immopro

      - name: Publier sur gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true

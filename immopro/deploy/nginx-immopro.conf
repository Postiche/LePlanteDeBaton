# Alternative sans Docker : Nginx + Certbot devant uvicorn (service systemd)
# sudo certbot --nginx -d immo.mondomaine.fr
server {
    listen 80;
    server_name immo.mondomaine.fr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name immo.mondomaine.fr;
    ssl_certificate     /etc/letsencrypt/live/immo.mondomaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immo.mondomaine.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

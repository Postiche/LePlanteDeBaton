# Déploiement de production : Caddy (HTTPS automatique Let's Encrypt) + application + PostgreSQL.
# Usage : cp deploy/.env.production.example deploy/.env.production (puis éditer) ;
#         docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --build
services:
  db:
    image: postgres:15-alpine  # même version majeure que pg_dump de l image applicative (bookworm)
    restart: unless-stopped
    environment:
      POSTGRES_DB: immopro
      POSTGRES_USER: immopro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immopro"]
      interval: 10s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?définir SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://immopro:${POSTGRES_PASSWORD}@db:5432/immopro
      PUBLIC_BASE_URL: https://${DOMAIN}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      BACKUP_INTERVAL_HOURS: "24"
      BACKUP_KEEP: "14"
    volumes:
      - appdata:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?définir DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
